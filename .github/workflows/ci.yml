name: checks
on: [push, pull_request, workflow_dispatch]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          python-version: "3.11"
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv run ruff check app scripts tests
      - run: uv run ruff format --check app scripts tests
      - run: uv run mypy app
      - run: uv run python scripts/benchmark_retrieval.py --offline
      - run: docker compose config --quiet
  databases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          python-version: "3.11"
      - run: uv sync --frozen
      - run: docker compose up -d --wait --wait-timeout 300 milvus neo4j
      - run: uv run pytest tests/integration/test_live_stores.py -v
        env:
          RUN_INTEGRATION: "1"
      - if: failure()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose down -v
