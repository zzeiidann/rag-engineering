name: authorization-graph-rag
services:
  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      MILVUS_URI: http://milvus:19530
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-local-graph-password}
      CATALOG_PATH: /workspace/var/catalog.db
      FASTEMBED_CACHE_PATH: /home/appuser/.cache/fastembed
      AUTH_SERVICE_URL: http://auth:5000
      AUTH_SERVICE_SECRET: ${AUTH_SERVICE_SECRET:-local-introspection-secret}
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - catalog:/workspace/var
      - embeddings:/home/appuser/.cache/fastembed
    depends_on:
      auth: {condition: service_healthy}
      milvus: {condition: service_healthy}
      neo4j: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=10)"]
      interval: 30s
      timeout: 15s
      start_period: 180s
      retries: 5
    restart: unless-stopped
  auth:
    build: .
    command: ["gunicorn", "--bind", "0.0.0.0:5000", "--workers", "1", "--threads", "4", "--timeout", "90", "auth_service:create_app()"]
    environment:
      AUTH_DATABASE_PATH: /data/auth.db
      RAG_API_URL: ${RAG_API_URL:-http://api:8000}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-local-session-secret-change-me}
      AUTH_SERVICE_SECRET: ${AUTH_SERVICE_SECRET:-local-introspection-secret}
      AUTH_BOOTSTRAP_USERNAME: ${AUTH_BOOTSTRAP_USERNAME:-admin}
      AUTH_BOOTSTRAP_PASSWORD: ${AUTH_BOOTSTRAP_PASSWORD:-admin-change-me}
      AUTH_TOKEN_TTL_HOURS: ${AUTH_TOKEN_TTL_HOURS:-24}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
    ports: ["127.0.0.1:5001:5000"]
    volumes: ["auth-data:/data"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 10s
      retries: 5
    restart: unless-stopped
  milvus:
    image: milvusdb/milvus:v2.6.13
    command: ["milvus", "run", "standalone"]
    security_opt: ["seccomp:unconfined"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_REGION: us-east-1
    volumes: ["milvus:/var/lib/milvus"]
    ports: ["127.0.0.1:19530:19530", "127.0.0.1:9091:9091"]
    depends_on:
      etcd: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      start_period: 90s
      retries: 10
  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: 1000
      ETCD_QUOTA_BACKEND_BYTES: 4294967296
      ETCD_SNAPSHOT_COUNT: 50000
    command: ["etcd", "-advertise-client-urls=http://etcd:2379", "-listen-client-urls", "http://0.0.0.0:2379", "--data-dir", "/etcd"]
    volumes: ["etcd:/etcd"]
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 15s
      timeout: 10s
      retries: 5
  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: ["minio", "server", "/minio_data"]
    volumes: ["minio:/minio_data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 5
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-local-graph-password}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
    volumes: ["neo4j:/data"]
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 10
volumes:
  auth-data:
  catalog:
  embeddings:
  milvus:
  etcd:
  minio:
  neo4j:
